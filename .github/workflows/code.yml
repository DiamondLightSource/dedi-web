name: dedi-web code CI
on:
  workflow_call:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        node-version: [24.x, 26.x]

    name: test/${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: build
        run: npm run build
