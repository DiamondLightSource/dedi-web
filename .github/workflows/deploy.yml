name: github-pages-deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.1.0"
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Deploy to GH Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: ./dist
          branch: gh-pages
